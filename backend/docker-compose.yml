version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: meet2go-postgres
    environment:
      POSTGRES_DB: meet2go
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: .
    container_name: meet2go-backend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=meet2go
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_SSL=false
      - JWT_SECRET=${JWT_SECRET:-change_this_in_production}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./:/app
      - /app/node_modules
    command: npm start

volumes:
  postgres_data:

